<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AURA — AI Assistant</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- HEADER -->
<header>
  <div class="header-left">
    <div class="logo-mark">✦</div>
    <div>
      <div class="logo-text">AU<span>RA</span></div>
      <div class="logo-tagline">AI · v2.1</div>
    </div>
  </div>
  <div class="header-right">
    <div class="status-pill"><div class="status-dot"></div>Online</div>
    <button class="clear-btn" onclick="clearChat()">↺ Clear</button>
  </div>
</header>

<!-- CHAT WRAPPER -->
<div class="chat-wrapper">

  <!-- WELCOME -->
  <div class="welcome" id="welcome">
    <div class="welcome-orb">✦</div>
    <div>
      <div class="welcome-heading">Hello, I'm <em>Aura.</em><br>How can I help?</div>
    </div>
    <div class="welcome-sub">Ask me anything — I can write, code, explain, analyze, brainstorm, and much more.</div>
    <div class="suggestions">
      <button class="suggestion-btn" onclick="useSuggestion(this)">
        <span class="suggestion-icon">✍️</span>Write a short story about a robot learning to dream
      </button>
      <button class="suggestion-btn" onclick="useSuggestion(this)">
        <span class="suggestion-icon">💻</span>Explain how async/await works in JavaScript
      </button>
      <button class="suggestion-btn" onclick="useSuggestion(this)">
        <span class="suggestion-icon">🧠</span>What are the most mind-blowing facts about the universe?
      </button>
      <button class="suggestion-btn" onclick="useSuggestion(this)">
        <span class="suggestion-icon">📧</span>Write a professional email declining a job offer politely
      </button>
    </div>
  </div>

  <!-- MESSAGES -->
  <div class="messages" id="messages"></div>

</div>

<!-- INPUT -->
<div class="input-area">
  <div class="input-wrap">
    <textarea id="userInput" placeholder="Message Aura…" rows="1" oninput="autoResize(this); updateCharCount()"></textarea>
    <button class="send-btn" id="sendBtn" onclick="sendMessage()" title="Send (Enter)">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
    </button>
  </div>
  <div class="input-footer">
    <span class="input-hint">Press <kbd>Enter</kbd> to send · <kbd>Shift+Enter</kbd> for new line</span>
    <span class="char-count" id="charCount">0 / 2000</span>
  </div>
</div>

<script src="node.js"></script>
</body>
</html>
